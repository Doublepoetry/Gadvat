name: Add photos or maps
description: Share your own photos or fort layout maps
title: "[Photos] "
labels: [photos]
body:
  - type: input
    id: fort
    attributes:
      label: Fort
      description: Name and ID if you know it (e.g. Raigad, F014)
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Photos / maps
      description: Drag images here, with a caption for each. Max 1 MB each.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit as
    validations:
      required: true
  - type: checkboxes
    id: own
    attributes:
      label: Permission
      options:
        - label: These are my own, and I release them under CC BY-SA 4.0
          required: true
