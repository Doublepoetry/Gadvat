name: Add history or facts
description: Suggest historical details or facts about a fort
title: "[History] "
labels: [history]
body:
  - type: input
    id: fort
    attributes:
      label: Fort
      description: Name and ID if you know it (e.g. Raigad, F014)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should be added?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Books, gazetteers, inscriptions, links. Required.
    validations:
      required: true
